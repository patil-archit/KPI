server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback
  location / { try_files $uri $uri/ /index.html; }

  # Plant API + evidence (agents' read-only surface) -> backend plant app
  location /api/        { proxy_pass http://backend:8000; }
  location /evidence/   { proxy_pass http://backend:8000; }

  # Developer Mode -> backend dev app (separate port, own token)
  location /dev/        { proxy_pass http://backend:8100; }
}
